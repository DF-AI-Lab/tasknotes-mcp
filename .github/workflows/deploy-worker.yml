# Deploys the Cloudflare Worker from GitHub, so no computer is needed.
# Needs these repository secrets (GitHub > Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, GOOGLE_SERVICE_ACCOUNT, APP_KEY, MCP_PIN, TOKEN_SECRET
name: Deploy Worker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['worker/**']
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Worker tests
        run: node --test worker/test/*.test.js
      # Pasted secrets often carry a stray space or line break. Strip them, and show the
      # length and line count only (never the value) so a bad paste is easy to spot.
      - name: Clean Cloudflare secrets
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Token: $(printf '%s' "$T" | wc -l) line breaks before cleaning"
          t=$(printf '%s' "$T" | tr -d '[:space:]'); a=$(printf '%s' "$A" | tr -d '[:space:]')
          echo "::add-mask::$t"
          echo "Token length after cleaning: ${#t}. Account ID length: ${#a} (should be 32)"
          echo "CF_TOKEN=$t" >> "$GITHUB_ENV"
          echo "CF_ACCOUNT=$a" >> "$GITHUB_ENV"
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT }}
          workingDirectory: worker
          secrets: |
            GOOGLE_SERVICE_ACCOUNT
            APP_KEY
            MCP_PIN
            TOKEN_SECRET
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          APP_KEY: ${{ secrets.APP_KEY }}
          MCP_PIN: ${{ secrets.MCP_PIN }}
          TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
