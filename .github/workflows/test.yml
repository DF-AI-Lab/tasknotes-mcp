name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: App tests
        run: node --test tests/*.test.js
      - name: Worker tests
        run: node --test worker/test/*.test.js
