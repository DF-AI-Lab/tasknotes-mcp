<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101114">
<title>TaskNotes demo 2</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23fff'/%3E%3Cstop offset='1' stop-color='%23d9dbe3'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='120' height='120' rx='26' fill='url(%23g)'/%3E%3Ctext x='58' y='82' text-anchor='middle' font-family='Helvetica,Arial,sans-serif' font-weight='800' font-size='60' letter-spacing='-3' fill='%230c0d12'%3ETN%3C/text%3E%3Ccircle cx='96' cy='26' r='7' fill='%230c0d12'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23fff'/%3E%3Cstop offset='1' stop-color='%23d9dbe3'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='120' height='120' rx='26' fill='url(%23g)'/%3E%3Ctext x='58' y='82' text-anchor='middle' font-family='Helvetica,Arial,sans-serif' font-weight='800' font-size='60' letter-spacing='-3' fill='%230c0d12'%3ETN%3C/text%3E%3Ccircle cx='96' cy='26' r='7' fill='%230c0d12'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* ===== TOKENS (the style guide) ===== */
:root{
  --bg:#101114;
  --glow:#3a3b41;
  --surface:rgba(255,255,255,.06);
  --surface-2:rgba(255,255,255,.10);
  --hero:linear-gradient(160deg,rgba(255,255,255,.15),rgba(255,255,255,.05));
  --edge:rgba(255,255,255,.08);
  --line:rgba(255,255,255,.08);
  --text:#f2f3f7;
  --muted:#8b8d94;
  --accent:#f2f3f7;
  --on-accent:#0c0d12;
  --late:#ff8a80;
  --cat-1:#ffb072; --cat-2:#9db4ff; --cat-3:#c9a6ff; --cat-4:#6fe0b5; --cat-5:#ff9ec4; --cat-6:#f2d675;
  --display:"Bricolage Grotesque","Geist",system-ui,sans-serif;
  --font:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,Menlo,monospace;
  --gutter:20px; --gap:16px;
  --r-hero:12px; --r-panel:10px; --r-day:8px; --r-pill:99px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(130% 420px at 50% -120px,var(--glow) 0%,transparent 65%),var(--bg);background-attachment:fixed;
  color:var(--text);font:15px/1.35 var(--font);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,.field:focus-visible,.dt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ===== FRAME ===== */
.app{height:100%;max-width:430px;margin:0 auto;display:flex;flex-direction:column}
.top{flex:none;padding:calc(20px + env(safe-area-inset-top)) var(--gutter) 0}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:8px var(--gutter) 120px;
  -webkit-mask-image:linear-gradient(transparent,#000 8px,#000 calc(100% - 56px),transparent);mask-image:linear-gradient(transparent,#000 8px,#000 calc(100% - 56px),transparent);scrollbar-width:none;display:flex;flex-direction:column;gap:var(--gap)}

/* ===== HEADER ===== */
.head{display:flex;flex-direction:column;gap:7px}
.fullbar{height:3px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.fullbar i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .25s}
.head-row{display:flex;align-items:center;gap:12px;min-height:46px}
.app-icon{width:40px;height:40px;border-radius:10px;flex:none;display:block;stroke:none}
.head-text{flex:1;min-width:0}
.eyebrow{font-size:13px;color:#8b8d94;display:flex;align-items:center;gap:6px;white-space:nowrap}
.clock{font:400 12px var(--mono);color:#8b8d94;margin-left:4px;white-space:nowrap}
.eyebrow .dot{width:7px;height:7px;border-radius:99px;background:var(--cat-6)}
.icon-wrap{position:relative;width:40px;height:40px;flex:none;border-radius:10px;display:block}
.status{position:absolute;left:29.5px;top:6.5px;width:5px;height:5px;border-radius:50%;background:var(--cat-4);box-shadow:0 0 0 1px #0c0d12}
.icon-wrap.warn .status{background:var(--cat-6)}
.icon-wrap.spin .app-icon{animation:spin .8s linear infinite}
.title{font:700 27px/1.05 "Bricolage Grotesque",Geist,sans-serif;letter-spacing:-.02em;margin:0;white-space:nowrap}
.ring{width:46px;height:46px;border-radius:99px;border:3px solid rgba(255,255,255,.10);display:grid;place-items:center;font:500 12px "Geist Mono",monospace;flex:none;position:relative}
.ring svg{position:absolute;left:-3px;top:-3px;width:46px;height:46px;stroke:var(--accent);stroke-width:3;stroke-linecap:butt;transform:rotate(-90deg)}
.ring .fill{transition:stroke-dasharray .25s}
.icon-btn{width:40px;height:40px;border-radius:99px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);display:grid;place-items:center;flex:none}
.icon-btn.plain{background:none;border:0;width:28px}
.icon-btn svg{width:19px;height:19px;stroke:#f2f3f7;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-btn.plain svg{fill:#f2f3f7}
.icon-btn.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.update-banner{display:flex;align-items:center;justify-content:space-between;width:100%;background:#f2f3f7;color:#0c0d12;border:0;border-radius:14px;padding:11px 14px;min-height:44px;font:600 13.5px Geist,sans-serif}
.update-banner span{font-weight:500;opacity:.7}
.foot{margin:2px 0 0;text-align:center;color:var(--muted);font:400 12px var(--mono)}

/* ===== WEEK STRIP ===== */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-radius:var(--r-day);font-size:12px;color:var(--muted);text-align:center}
.day b{font:600 16px var(--font);color:var(--text)}
.day .load{height:24px;display:flex;align-items:flex-end}
.day .load i{display:block;width:4px;border-radius:4px;background:var(--muted);transition:height .2s}
.week{position:relative}
.day{position:relative;z-index:1;transition:color .2s}
.day.on{color:#55575e}
.dayhl{position:absolute;top:0;bottom:0;left:0;width:0;border-radius:var(--r-day);background:var(--accent);z-index:0;pointer-events:none}
.day.on b{color:var(--on-accent)} .day.on .load i{background:var(--on-accent)}

/* ===== SHARED BITS ===== */
.label{font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px;margin-bottom:-6px}
.label svg{width:14px;height:14px}
.meta{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:6px}
.meta .late{color:var(--late)}
.mono{font-family:var(--mono)}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.tick{width:24px;height:24px;border-radius:50%;border:1.6px solid var(--muted);flex:none;display:grid;place-items:center;transition:background .15s}
.tick.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tick svg{width:13px;height:13px;stroke-width:2.6}
.quiet{margin:0;padding:22px 0;text-align:center;color:var(--muted);font-size:15px}

/* ===== NOW CARD ===== */
.now{border-radius:var(--r-hero);padding:20px 20px 18px;display:flex;flex-direction:column;gap:10px;background:var(--hero);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 18px 30px -18px rgba(0,0,0,.7)}
.now-top{display:flex;justify-content:space-between;align-items:center}
.now h2{font:700 31px/1.05 var(--display);letter-spacing:-.02em;margin:0;overflow-wrap:anywhere}
.now p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
.now .open{display:flex;flex-direction:column;gap:10px;width:100%}
.btns{display:flex;gap:8px;margin-top:4px}
.btn{flex:1;height:46px;border-radius:var(--r-pill);font-weight:600;font-size:15px;background:var(--surface-2);text-align:center;transition:transform .15s,opacity .15s}
.btn.primary{flex:2;background:var(--accent);color:var(--on-accent)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.35;cursor:default}
.pin{color:var(--muted);width:32px;height:32px;display:grid;place-items:center;border-radius:50%}
.pin.on{color:var(--text);background:var(--surface-2)}
.pin svg{width:17px;height:17px}

/* ===== PANEL + ROWS ===== */
.panel{border-radius:var(--r-panel);background:var(--surface);box-shadow:inset 0 1px 0 var(--edge);padding:2px 16px}
.row{display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line);min-height:56px;width:100%}
.row:last-child{border-bottom:0}
.row .open{flex:1;min-width:0;display:flex;gap:12px;align-items:center;padding:13px 0;min-height:56px}
.row .main{min-width:0;flex:1}
.row b{font-weight:600;font-size:15.5px;display:block;overflow-wrap:anywhere}
.row .end{font-size:13px;color:var(--muted);white-space:nowrap}
.row{position:relative}
/* Spring tick: strike draws, row drops to one line, then springs into place */
.ttl{background:linear-gradient(var(--muted),var(--muted)) no-repeat 0 55%/0% 1.5px;transition:background-size .25s ease,color .25s ease}
.row.isdone .ttl,.row.ticking .ttl{background-size:100% 1.5px;color:var(--muted)}
.row.isdone,.row.isdone .open{min-height:46px}
.row.isdone .open{padding:10px 0}
.row.isdone b{font-size:14.5px;font-weight:500}
.row.isdone .meta{display:none}
.row.isdone .end{font-family:var(--mono);font-size:12px}
.row.ticking .tick{background:var(--accent);border-color:var(--accent);color:var(--on-accent);animation:pop .4s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{50%{transform:scale(1.3)}}
.row.lift{z-index:3;margin:0 -16px;padding:0 16px;width:auto;border-radius:10px;background:#2a2b31;border-bottom-color:transparent;box-shadow:0 14px 28px -8px rgba(0,0,0,.65);transition:background .3s,box-shadow .3s}
.row .pin{width:34px;height:44px;border-radius:10px;flex:none}
.row .more{width:30px;height:44px;margin-right:-8px;display:grid;place-items:center;color:var(--muted);flex:none;border-radius:10px}
.row .more svg,.big .more svg{width:18px;height:18px}
.row.big{--c:#8b8d94;display:block;margin:6px -22px 8px;width:auto;padding:16px 18px 12px;border-radius:20px;border:1.5px solid transparent;min-height:0;z-index:2;
  background:linear-gradient(#1c1d22,#1c1d22) padding-box,linear-gradient(140deg,var(--c) 0%,color-mix(in srgb,var(--c) 25%,transparent) 38%,rgba(255,255,255,.1) 100%) border-box;
  box-shadow:0 16px 36px rgba(0,0,0,.6)}
.panel:has(.row.big){overflow:visible}
.row.big:first-child{margin-top:-2px}.row.big:last-child{margin-bottom:-2px}
.row:has(+ .row.big){border-bottom:0}
.big-in{display:flex;flex-direction:column}
.big-top{display:flex;gap:16px;align-items:center}
.bigtick{position:relative;flex:none;width:52px;height:52px;border-radius:50%;border:2px solid var(--c);color:var(--c);display:grid;place-items:center;background:color-mix(in srgb,var(--c) 8%,transparent);transition:background .2s,color .2s}
.bigtick svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.bigtick .ring{position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--c);animation:ring 2.4s ease-out infinite}
@keyframes ring{0%{transform:scale(1);opacity:.55}70%,100%{transform:scale(1.45);opacity:0}}
.big.ticking .bigtick{background:var(--c);color:#101114;animation:pop .4s cubic-bezier(.3,1.8,.5,1)}
.big.ticking .ring{display:none}
.big .open{flex:1;min-width:0;display:block;padding:0;min-height:0;text-align:left}
.big h2{font:700 26px/1.15 var(--display);letter-spacing:-.02em;margin:0;overflow-wrap:anywhere}
.big .bmeta{margin-top:5px;font-size:13.5px;color:var(--muted);display:flex;align-items:center;gap:7px}
.big .bmeta i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.big p{margin:14px 0 0;color:var(--muted);font-size:15px;line-height:1.5}
.bigtick.noteglyph{background:color-mix(in srgb,var(--c) 10%,transparent)}.vval{font:600 17px/1.4 ui-monospace,Menlo,monospace;letter-spacing:.06em;margin-top:2px}
.bigtick.noteglyph svg{width:22px;height:22px;stroke-width:1.8}
.laterbtn.on{background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--text);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 50%,transparent)}
.laterbtn.on svg{fill:currentColor}
.laterbtn[data-act="vshow"] svg{fill:none}
.big-foot{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.07)}
.laterbtn{height:40px;padding:0 16px 0 13px;border-radius:20px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);font-size:15px;font-weight:600;display:flex;align-items:center;gap:7px}
.laterbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.big .acts{display:flex;gap:4px;align-items:center;margin-right:-8px;color:var(--muted)}
.big .more{width:32px;height:32px;display:grid;place-items:center;color:var(--muted);border-radius:50%}
@media (prefers-reduced-motion:reduce){.bigtick .ring{animation:none;opacity:0}}
.row .pin.on{background:none;color:var(--text)}
.pin.on svg{fill:currentColor}
.pin.pop svg{animation:pop .4s cubic-bezier(.3,1.8,.5,1)}
.tickbtn{width:44px;height:44px;margin:-10px;display:grid;place-items:center;flex:none;border-radius:50%}
.row.note .glyph{width:24px;height:24px;display:grid;place-items:center;color:var(--muted);flex:none}
.row.note .meta{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.note .open{gap:12px}

/* ===== CHIPS + PILLS ===== */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.filterbar{flex:none;display:flex;align-items:center;gap:18px;margin:-6px calc(-1 * var(--gutter)) -6px 0}
.filterbar .chip{height:32px;padding:0;border-radius:0;background:none;font-size:14px;font-weight:500;color:var(--muted);gap:6px;flex:none;box-shadow:inset 0 -2px 0 transparent;transition:color .15s,box-shadow .15s}
.filterbar .chip.on{background:none;color:var(--text);font-weight:600;box-shadow:inset 0 -2px 0 var(--text)}
.filters{flex:1;min-width:0;flex-wrap:nowrap;gap:18px;overflow-x:auto;scrollbar-width:none;padding-right:12px;
  -webkit-mask-image:linear-gradient(90deg,#000,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000,#000 calc(100% - 28px),transparent)}
.filters.scrolled{-webkit-mask-image:linear-gradient(90deg,transparent,#000 8px,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,transparent,#000 8px,#000 calc(100% - 28px),transparent)}
.filters::-webkit-scrollbar{display:none}
.filters .chip svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.filters .chip.on svg{fill:currentColor}
.filters .sep{display:none}
.vbar .filters{flex:none;padding-right:0;-webkit-mask-image:none;mask-image:none}
.vsearch{flex:1;min-width:0;display:flex;align-items:center;gap:6px;height:30px;margin:0 var(--gutter) 1px auto;max-width:170px;padding:0 10px;border-radius:9px;background:rgba(255,255,255,.06);color:var(--muted)}
.sheet .vsearch.vsec{flex:none;height:46px;margin:2px 0 6px;max-width:none;padding:0 14px;gap:10px;border-radius:12px}
.vsearch.vsec input{font-size:16px}
.vsearch.wide{max-width:none;margin:0 0 0 0}
.nsbtn{flex:none;width:32px;height:32px;margin-right:calc(var(--gutter) - 6px);display:grid;place-items:center;color:var(--muted);border-radius:9px}
.nsbtn:hover{color:var(--text)}
.nsbtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.vsearch:focus-within{background:rgba(255,255,255,.1);color:var(--text)}
.vsearch svg{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.vsearch input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:14px}
.vsearch input::placeholder{color:var(--muted)}
.vsearch input::-webkit-search-cancel-button{display:none}
.chip{height:44px;padding:0 16px;border-radius:var(--r-pill);background:var(--surface);color:var(--muted);font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;transition:background .15s}
.chip.on{background:var(--surface-2);color:var(--text);font-weight:600}
.chip.open{font-weight:700;color:var(--text)}
.chip svg{width:16px;height:16px}
.link{height:44px;color:var(--muted);font-size:13px;text-align:center;width:100%}

/* ===== BOTTOM BAR ===== */
.edge{position:absolute;left:50%;bottom:100%;width:390px;height:26px;margin-left:-195px;margin-bottom:-1px;overflow:visible;pointer-events:none;color:var(--glow);stroke-width:1}
.edge .f{fill:var(--bg);stroke:none}
.bar::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:48px;background:linear-gradient(to bottom,rgba(16,17,20,0),var(--bg));pointer-events:none}
.bar::after{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:rgba(255,255,255,.22);pointer-events:none}
.scroll::-webkit-scrollbar{display:none}
.down{position:absolute;right:var(--gutter);top:-52px;width:36px;height:36px;border-radius:11px;background:#2a2b31;color:var(--text);display:grid;place-items:center;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),0 8px 18px rgba(0,0,0,.5);opacity:0;transform:translateY(6px);pointer-events:none;transition:opacity .2s,transform .2s}
.down.show{opacity:1;transform:none;pointer-events:auto}
.down svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bar{position:relative;flex:none;display:grid;grid-template-columns:1fr 1fr 64px 1fr 1fr;align-items:center;padding:8px 10px calc(14px + env(safe-area-inset-bottom));
  background:rgba(16,17,20,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tab{height:44px;font-size:14px;font-weight:500;color:var(--muted);text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.tab::after{content:"";width:5px;height:5px;border-radius:50%;background:transparent;transition:background .2s}
.tab.on{color:var(--text);font-weight:700}
.tab.on::after{background:var(--text)}
.add{position:relative;z-index:1;width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;justify-self:center;align-self:start;margin-top:-36px;
  background:linear-gradient(180deg,#fff,#d9dbe3);
  box-shadow:0 0 0 6px var(--bg),0 16px 30px rgba(0,0,0,.75),0 0 26px rgba(255,255,255,.14),inset 0 -3px 6px rgba(0,0,0,.18),inset 0 1px 0 #fff}
.add svg{width:22px;height:22px;stroke-width:2}

/* ===== SHEET ===== */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:430px;max-height:92%;overflow-y:auto;z-index:11;
  transform:translate(-50%,100%);visibility:hidden;transition:transform .22s ease,visibility 0s .22s;
  border-radius:var(--r-hero) var(--r-hero) 0 0;background:var(--hero),var(--bg);box-shadow:inset 0 1px 0 rgba(255,255,255,.18);
  padding:14px var(--gutter) calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.sheet.show{transform:translate(-50%,0);visibility:visible;transition-delay:0s}
.sh-head{display:flex;justify-content:space-between;align-items:center;min-height:32px}
.sh-head .label{margin:0}
.x{width:44px;height:44px;margin:-6px -10px -6px 0;display:grid;place-items:center;color:var(--muted)}
.field{width:100%;display:block;background:var(--surface);border:0;border-radius:var(--r-day);color:var(--text);font:600 17px/1.3 var(--font);padding:14px 16px;min-height:52px;resize:none;box-shadow:inset 0 1px 0 var(--edge)}
.field::placeholder{color:var(--muted);font-weight:400}
textarea.field{font:400 15px/1.45 var(--font);min-height:96px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.grab{width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.22);margin:0 auto 4px}
.sheet .tline{width:100%;background:none;border:0;border-bottom:1px solid var(--edge);color:var(--text);font:700 22px/1.25 var(--display);padding:4px 0 14px;outline:none}
.sheet .tline::placeholder{color:var(--muted);font-weight:500}
.sheet .nline{width:100%;background:none;border:0;border-bottom:1px solid var(--edge);color:var(--text);font:400 15px/1.45 var(--font);padding:4px 0 14px;min-height:120px;resize:none;outline:none}
.sheet .nline::placeholder{color:var(--muted)}
.sbody{position:relative;height:220px;border-bottom:1px solid var(--edge)}
.sheet .sbody .nline{height:100%;min-height:0;border-bottom:0;transition:opacity .2s ease,transform .25s cubic-bezier(.2,.8,.2,1)}
.drawer{position:absolute;inset:0;padding-top:2px;overflow-y:auto;opacity:0;transform:translateY(-8px);pointer-events:none;transition:opacity .2s ease,transform .25s cubic-bezier(.2,.8,.2,1)}
.drawer .chips{gap:8px}.drawer .chip,.drawer .dt{height:36px}
.sbody.open .drawer{opacity:1;transform:none;pointer-events:auto}
.sbody.open .nline{opacity:0;transform:translateY(8px);pointer-events:none}
.pills3 .chip.open{background:var(--surface-2);color:var(--text);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
@media (prefers-reduced-motion:reduce){.drawer,.sheet .sbody .nline{transition:none}}
.addcat{width:36px;padding:0;justify-content:center}.addcat svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.newcat{width:150px;animation:catin .2s ease}@keyframes catin{from{opacity:0;transform:scale(.9)}}
.pills3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pills3 .chip{height:36px;justify-content:center;width:100%;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar{display:flex;gap:10px;align-items:center}
.files{position:absolute;left:0;right:0;bottom:10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;transition:opacity .2s}
.files:empty{display:none}
.sbody.open .files{opacity:0;pointer-events:none}
.sbody:has(.files:not(:empty)) .nline{padding-bottom:50px}
.fchip{flex:none;display:flex;align-items:center;gap:6px;height:32px;max-width:200px;padding:0 4px 0 10px;border-radius:9px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--edge);font-size:13px;color:var(--text)}
.cfiles{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.cfiles .fchip{padding-right:10px}
.dcats{flex-wrap:wrap}
.dpickbig{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:88px;border-radius:14px;border:1.5px dashed var(--edge);color:var(--muted);font:500 15px var(--font)}
.dpickbig svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.fchip.dfile{max-width:none;width:100%;height:56px;padding:0 6px 0 14px;gap:10px;border-radius:14px;font-size:15px}
.fchip.dfile svg{width:20px;height:20px}
.fchip.dfile b{flex:1}
.fchip.dfile i{font-style:normal;color:var(--muted);font-size:13px}
.fchip.dfile button{width:auto;height:36px;padding:0 12px;border-radius:10px;color:var(--text);background:rgba(255,255,255,.06);font:500 13px var(--font)}
.fchip b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fchip svg{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fchip>svg{color:var(--muted)}
.fchip button{width:24px;height:24px;display:grid;place-items:center;color:var(--muted);border-radius:6px}
.ib{width:42px;height:36px;flex:none;border-radius:11px;display:grid;place-items:center;color:var(--muted);background:var(--surface);box-shadow:inset 0 0 0 1px var(--edge)}
.ib svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib.on{color:var(--text);box-shadow:inset 0 0 0 1px rgba(255,255,255,.45)}
.ib.on[data-act="spin"] svg{fill:currentColor}
.sbar .btn.primary{flex:1;height:36px;min-height:36px}
.ib.del{color:#ff5a5f}
.dt{height:44px;border:0;border-radius:var(--r-pill);background:var(--surface-2);color:var(--text);font:500 14px var(--font);padding:0 16px;min-width:0}
.sw{width:50px;height:30px;border-radius:var(--r-pill);background:var(--surface-2);position:relative;flex:none;transition:background .15s}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.sw.on{background:var(--accent)} .sw.on i{transform:translateX(20px);background:var(--on-accent)}

/* ===== TOAST ===== */
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));width:calc(100% - 40px);max-width:390px;z-index:12;
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 8px 6px 18px;min-height:52px;border-radius:var(--r-pill);
  background:linear-gradient(var(--surface-2),var(--surface-2)),var(--bg);box-shadow:inset 0 1px 0 var(--edge),0 10px 24px rgba(0,0,0,.6);
  font-size:14px;transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:transform .2s,opacity .2s}
.toast.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.toast span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast button{height:44px;padding:0 14px;font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<script>
(function(){
'use strict';
/* ---------- helpers (from docs/store.js, copied so the demo stands alone) ---------- */
var KEY='tasknotes-demo2';
var pad=function(n){return String(n).padStart(2,'0')};
var ymd=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var addDays=function(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x};
var rid=function(p){return p+'_'+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4)};
var nowIso=function(){return new Date().toISOString()};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var fmtMins=function(m){m=Number(m)||0;if(!m)return '';return m>=60?Math.floor(m/60)+'h'+(m%60?' '+(m%60)+'m':''):m+'m'};
var today=function(){var d=new Date();d.setHours(12,0,0,0);return d};
var parseDay=function(s){return new Date(s+'T12:00:00')};
var cap=function(s){return s.charAt(0).toUpperCase()+s.slice(1)};

function dueLabel(due,t){
  if(!due)return 'no date';
  var d=ymd(t),tm=ymd(addDays(t,1)),wk=ymd(addDays(t,7));
  if(due===d)return 'today';
  if(due===tm)return 'tomorrow';
  var dt=parseDay(due);
  if(due>d&&due<=wk)return dt.toLocaleDateString('en-GB',{weekday:'short'});
  return dt.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
}
var live=function(r){return !r.deleted_at};
var DAYS=['sun','mon','tue','wed','thu','fri','sat'];
function parseQuick(text,s,t){
  var x=' '+String(text||'')+' ',category='',due='',mins=0;
  x=x.replace(/\s#([\w-]+)/g,function(m,c){
    var hit=s.cats.filter(live).find(function(k){return k.name.toLowerCase().replace(/\s+/g,'').indexOf(c.toLowerCase())===0});
    if(hit){category=hit.name;return ' '}
    return m;
  });
  x=x.replace(/\s(\d+(?:\.\d+)?)\s?(h|hr|hrs|hours?|m|min|mins|minutes?)(?=\s)/i,function(m,n,u){
    mins=Math.round(Number(n)*(/^h/i.test(u)?60:1));return ' ';
  });
  x=x.replace(/\s(today|tonight|tomorrow|tmrw|mon|tue|wed|thu|fri|sat|sun)[a-z]*(?=\s)/i,function(m,w){
    w=w.toLowerCase();
    if(w==='today'||w==='tonight')due=ymd(t);
    else if(w==='tomorrow'||w==='tmrw')due=ymd(addDays(t,1));
    else{var n=(DAYS.indexOf(w)-t.getDay()+7)%7;if(n===0)n=7;due=ymd(addDays(t,n))}
    return ' ';
  });
  return {title:x.replace(/\s+/g,' ').trim(),category:category,due:due,mins:mins};
}

/* ---------- data ---------- */
function newItem(f){
  return {id:rid('i'),title:String(f.title||'').trim(),details:String(f.details||'').trim(),category:f.category||'',due:f.due||'',time:f.time||'',
    estimate_mins:Number(f.estimate_mins)||0,needs:!!f.needs,important:f.important||'',done:false,done_at:'',review_later:!!f.review_later,files:(f.files||[]).slice(),
    created:nowIso(),updated:nowIso(),deleted_at:'',deleted_by:''};
}
function seed(){
  var t=today(),d=function(n){return ymd(addDays(t,n))};
  var s={v:2,cats:[
    {name:'Home',colour:'var(--cat-1)',deleted_at:''},{name:'Work',colour:'var(--cat-3)',deleted_at:''},
    {name:'AI Lab',colour:'var(--cat-2)',deleted_at:''},{name:'Health',colour:'var(--cat-4)',deleted_at:''}],items:[]};
  var add=function(f){var r=newItem(f);s.items.push(r);return r};
  add({title:'Book MOT',category:'Home',due:d(0),estimate_mins:15,details:"Garage on Main St. Ring before 10am, ask for the Saturday slot. Bring the V5 and last year's certificate."});
  add({title:'Set up Cloudflare Worker',category:'AI Lab',due:d(0),estimate_mins:60});
  add({title:"Reply to Sam's email",category:'Work',due:d(0),estimate_mins:10,details:'Say yes to Thursday'});
  add({title:'Gym: legs',category:'Health',due:d(0),estimate_mins:50});
  add({title:'Pay window cleaner',category:'Home',due:d(-1),estimate_mins:5});
  add({title:'Clean out the shed',category:'Home',due:d(1),estimate_mins:90});
  add({title:'Write MCP tool list',category:'AI Lab',due:d(1),estimate_mins:30});
  add({title:'Send invoice',category:'Work',due:d(3),estimate_mins:20,important:'yes'});
  add({title:'Plan next sprint',category:'Work',due:d(12),estimate_mins:45});
  add({title:'Read about passkeys',category:'AI Lab',estimate_mins:25});
  var b=add({title:'Order bin bags',category:'Home',due:d(0),estimate_mins:5});b.done=true;b.done_at=nowIso();
  add({title:'Shared login for all DF apps',category:'AI Lab',review_later:true});
  add({title:'Try reminders v2',category:'AI Lab'});
  add({title:'Fence panel is loose',category:'Home',review_later:true,important:'yes',details:'Back left corner. Needs two brackets and a post cap.'});
  add({title:'Ask about Friday rota',category:'Work',review_later:true});
  add({title:'Stretch after runs',category:'Health'});
  return s;
}
function load(){
  try{
    var r=localStorage.getItem(KEY);
    if(r){var s=JSON.parse(r);if(s&&Array.isArray(s.items)&&Array.isArray(s.cats)&&s.cats.length)return s}
  }catch(e){}
  return seed();
}
var state=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}

/* ---------- reading ---------- */
var isTask=function(r){return !!(r.due||r.time||r.needs)};
var pinned=function(r){return r.important==='yes'};
var items=function(){return state.items.filter(live)};
var todayStr=function(){return ymd(today())};
var dayKey=function(r){return r.due||todayStr()};
var catOf=function(name){return state.cats.filter(live).find(function(c){return c.name===name})||state.cats[0]};
var findItem=function(id){return state.items.find(function(r){return r.id===id})};
function ordered(list){
  var idx=new Map(state.items.map(function(r,i){return [r,i]}));
  var rank=function(r){return pinned(r)?0:r.time?1:2};
  return list.slice().sort(function(a,b){
    return rank(a)-rank(b)||(a.time||'99:99').localeCompare(b.time||'99:99')||idx.get(a)-idx.get(b);
  });
}
function weekDays(){
  var t=today(),mon=addDays(t,-((t.getDay()+6)%7)),out=[];
  for(var i=0;i<7;i++)out.push(addDays(mon,i));
  return out;
}
function loadH(mins){return Math.round(3+21*Math.min(1,mins/130))}

/* ---------- ui state ---------- */
var screen='day',picked=todayStr(),nf={review:false,cat:''},sh=null,toastTimer=0,toastUndo=null,upd=false,spinning=false;
var $scroll=document.getElementById('scroll'),$sheet=document.getElementById('sheet'),$scrim=document.getElementById('scrim'),
    $toast=document.getElementById('toast'),$toastMsg=document.getElementById('toast-msg');

/* ---------- html bits ---------- */
var ico=function(id){return '<svg><use href="#i-'+id+'"/></svg>'};
var dotHtml=function(name){return name?'<i class="dot" style="background:'+esc(catOf(name).colour)+'"></i>':''};
function metaHtml(r,extra){
  var parts=[];
  if(r.category)parts.push(dotHtml(r.category)+esc(r.category));
  if(r.time)parts.push('<span class="mono">'+esc(r.time)+'</span>');
  if(extra)parts.push(extra);
  return '<span class="meta">'+parts.join(' · ')+'</span>';
}
var curOpen=null,openPick;
function bigRow(r){
  var m=r.estimate_mins,col=r.category?catOf(r.category).colour:'';
  var meta=[r.category?'<i></i>'+esc(r.category):'',m?(m<60?m+' min':fmtMins(m)):'',r.time?'<span class="mono">'+esc(r.time)+'</span>':''].filter(Boolean).join('<span style="opacity:.6">·</span>');
  return '<div class="row big" data-fid="r'+r.id+'"'+(col?' style="--c:'+esc(col)+'"':'')+'><div class="big-in"><div class="big-top">'+
    '<button class="bigtick" data-act="tick" data-id="'+r.id+'" aria-label="Done"><i class="ring"></i>'+ico('tick')+'</button>'+
    '<button class="open" data-act="fold" data-id="'+r.id+'" aria-expanded="true"><h2>'+esc(r.title)+'</h2>'+(meta?'<span class="bmeta">'+meta+'</span>':'')+'</button></div>'+
    (r.details?'<p>'+esc(r.details)+'</p>':'')+((r.files||[]).length?'<div class="cfiles">'+r.files.map(function(x){return '<span class="fchip">'+ico('file')+'<b>'+esc(x.name)+'</b></span>'}).join('')+'</div>':'')+
    '<div class="big-foot"><button class="laterbtn" data-act="later" data-id="'+r.id+'">'+ico('clock')+'Later</button>'+
    '<span class="acts"><button class="pin'+(pinned(r)?' on':'')+'" data-act="pin" data-id="'+r.id+'" aria-label="'+(pinned(r)?'Unpin':'Pin')+'" aria-pressed="'+pinned(r)+'">'+ico('pin')+'</button>'+
    '<button class="more" data-act="open" data-id="'+r.id+'" aria-label="Edit">'+ico('dots')+'</button></span></div></div></div>';
}
function taskRow(r,extra){
  if(!r.done&&r.id===curOpen)return bigRow(r);
  var end=r.done?doneTime(r):fmtMins(r.estimate_mins);
  return '<div class="row'+(r.done?' isdone':'')+'" data-fid="r'+r.id+'"><button class="tickbtn" data-act="tick" data-id="'+r.id+'" aria-label="'+(r.done?'Undo':'Done')+'"><span class="tick'+(r.done?' on':'')+'">'+(r.done?ico('tick'):'')+'</span></button>'+
    '<button class="open" data-act="'+(r.done?'open':'expand')+'" data-id="'+r.id+'"'+(r.done?'':' aria-expanded="false"')+'><span class="main"><b><span class="ttl">'+esc(r.title)+'</span></b>'+metaHtml(r,extra)+'</span><span class="end">'+end+'</span></button>'+
    (r.done?'':'<button class="pin'+(pinned(r)?' on':'')+'" data-act="pin" data-id="'+r.id+'" aria-label="'+(pinned(r)?'Unpin':'Pin')+'" aria-pressed="'+pinned(r)+'">'+ico('pin')+'</button>'+
      '<button class="more" data-act="open" data-id="'+r.id+'" aria-label="Edit">'+ico('dots')+'</button>')+'</div>';
}
function doneTime(r){
  var d=new Date(r.done_at||r.updated);
  return isNaN(d)?'':String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
var noteOpen=null;
function bigNote(r){
  var col=r.category?catOf(r.category).colour:'';
  return '<div class="row big bignote" data-fid="r'+r.id+'"'+(col?' style="--c:'+esc(col)+'"':'')+'><div class="big-in"><div class="big-top">'+
    '<span class="bigtick noteglyph" aria-hidden="true">'+ico('note')+'</span>'+
    '<button class="open" data-act="nfold" data-id="'+r.id+'" aria-expanded="true"><h2>'+esc(r.title)+'</h2>'+(r.category?'<span class="bmeta"><i></i>'+esc(r.category)+'</span>':'')+'</button></div>'+
    (r.details?'<p style="white-space:pre-line">'+esc(r.details)+'</p>':'')+((r.files||[]).length?'<div class="cfiles">'+r.files.map(function(x){return '<span class="fchip">'+ico('file')+'<b>'+esc(x.name)+'</b></span>'}).join('')+'</div>':'')+

  var tm=[f.time?'<span class="mono">'+esc(f.time)+'</span>':'',f.estimate_mins?esc(fmtMins(f.estimate_mins)):''].filter(Boolean).join(' · ');
  return p('cat',!!f.category,f.category?dotHtml(f.category)+esc(f.category):'Category')+
    p('date',!!f.due,f.due?esc(cap(dueLabel(f.due,today()))):'Date')+
    p('time',!!(f.time||f.estimate_mins),tm||'Time');
}
function drawerHtml(){
  var f=sh.f,o=sh.open,c=function(act,v,on,inner){return '<button class="chip'+(on?' on':'')+'" data-act="'+act+'" data-v="'+esc(v)+'">'+inner+'</button>'};
  if(o==='cat')return '<div class="chips">'+state.cats.filter(live).map(function(k){return c('setcat',k.name,k.name===f.category,'<i class="dot" style="background:'+esc(k.colour)+'"></i>'+esc(k.name))}).join('')+c('setcat','',!f.category,'None')+(sh.newcat?'<input class="dt newcat" id="f-newcat" placeholder="New category" maxlength="24" autocomplete="off" aria-label="New category name">':'<button class="chip addcat" data-act="newcat" aria-label="Add category">'+ico('plus')+'</button>')+'</div>';
  if(o==='date'){
    var ts=todayStr(),tm=ymd(addDays(today(),1));
    return '<div class="chips">'+c('setdate',ts,f.due===ts,'Today')+c('setdate',tm,f.due===tm,'Tomorrow')+
      '<input class="dt" type="date" id="f-date" value="'+esc(f.due)+'" aria-label="Pick a date">'+c('setdate','',!f.due,'No date')+'</div>';
  }
  if(o==='time')return '<div class="chips"><input class="dt" type="time" id="f-time" value="'+esc(f.time)+'" aria-label="Pick a time">'+c('settime','',!f.time,'No time')+'</div>'+
    '<div class="chips" style="margin-top:8px">'+[5,10,15,20,30,45,60,90,120].map(function(m){return c('setmins',m,f.estimate_mins===m,fmtMins(m))}).join('')+c('setmins',0,!f.estimate_mins,'No length')+'</div>';
  return '';
}
function fsize(n){return n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB'}
function filesHtml(){return (sh.f.files||[]).map(function(x,i){return '<span class="fchip">'+ico('file')+'<b>'+esc(x.name)+'</b><button data-act="unattach" data-v="'+i+'" aria-label="Remove '+esc(x.name)+'">'+ico('x')+'</button></span>'}).join('')}
function pickFile(cb){var i=document.createElement('input');i.type='file';i.multiple=true;i.style.cssText='position:fixed;left:-999px;opacity:0';document.body.appendChild(i);i.onchange=function(){cb(Array.prototype.map.call(i.files,function(f){return {name:f.name,size:f.size}}));i.remove()};i.click()}
var newDoc=null;
function docFileHtml(){return newDoc.file?'<span class="fchip dfile">'+ico('file')+'<b>'+esc(newDoc.file.name)+'</b><i>'+esc(fsize(newDoc.file.size))+'</i><button data-act="dpick" aria-label="Change file">Change</button></span>':'<button class="dpickbig" data-act="dpick">'+ico('plus')+'Choose a file</button>'}
function openDoc(){
  sh=null;newDoc={file:null,cat:''};$sheet.setAttribute('aria-label','New document');
  $sheet.innerHTML='<div class="grab" aria-hidden="true"></div>'+
    '<input class="tline" id="d-name" placeholder="What is it?" autocomplete="off" maxlength="80" aria-label="Document name">'+
    '<div class="chips dcats">'+state.cats.filter(live).map(function(k){return '<button class="chip" data-act="dcat" data-v="'+esc(k.name)+'"><i class="dot" style="background:'+esc(k.colour)+'"></i>'+esc(k.name)+'</button>'}).join('')+'</div>'+
    '<div id="d-file">'+docFileHtml()+'</div>'+
    '<div class="sbar"><button class="btn primary" data-act="dsave" id="d-save" disabled>Save</button></div>';
  $scrim.classList.add('show');$sheet.classList.add('show');
}
function docReady(){var b=document.getElementById('d-save');if(b)b.disabled=!(newDoc.file&&document.getElementById('d-name').value.trim())}
function openSecret(){
  sh=null;$sheet.setAttribute('aria-label','New secret');
  $sheet.innerHTML='<div class="grab" aria-hidden="true"></div>'+
    '<input class="tline" id="v-name" placeholder="What is it for?" autocomplete="off" maxlength="80" aria-label="Name">'+
    '<div class="chips pills3">'+['Password','PIN','Code'].map(function(t,i){return '<button class="chip'+(i?'':' on')+'" data-act="vtype" data-v="'+t+'">'+t+'</button>'}).join('')+'</div>'+
    '<label class="vsearch wide vsec">'+ico('lock')+'<input id="v-val" type="password" placeholder="The secret" autocomplete="off" aria-label="The secret"></label>'+
    '<div class="sbar"><button class="btn primary" data-act="vsave">Save</button></div>';
  $scrim.classList.add('show');$sheet.classList.add('show');
  setTimeout(function(){var t=document.getElementById('v-name');if(t)t.focus()},230);
}
function headText(){
  var f=sh.f;return (sh.id?'Edit ':'New ')+(isTask(f)?'task':'note');
}
function renderSheet(){
  var f=sh.f;
  $sheet.setAttribute('aria-label','Item');
  $sheet.innerHTML='<div class="grab" aria-hidden="true"></div><span class="sr" id="sh-label">'+headText()+'</span>'+
    '<input class="tline" id="f-title" data-f="title" placeholder="What is it?" autocomplete="off" maxlength="160" value="'+esc(f.title)+'" aria-label="Title">'+
    '<div class="chips pills3" id="pills">'+pillsHtml()+'</div>'+
    '<div class="sbody'+(sh.open?' open':'')+'" id="sbody"><textarea class="nline" id="f-details" data-f="details" placeholder="Notes" rows="4" aria-label="Notes">'+esc(f.details)+'</textarea>'+
    '<div class="files" id="files">'+filesHtml()+'</div><div class="drawer" id="drawer">'+drawerHtml()+'</div></div>'+
    '<div class="sbar" id="sbar">'+sbarHtml()+'<button class="btn primary" data-act="save" id="save"'+(f.title.trim()?'':' disabled')+'>Save</button>'+delHtml()+'</div>';
}
function sbarHtml(){
  var f=sh.f,ib=function(act,on,icon,label){return '<button class="ib'+(on?' on':'')+'" data-act="'+act+'" aria-label="'+label+'"'+(act==='delete'?'':' aria-pressed="'+on+'"')+'>'+ico(icon)+'</button>'};
  return ib('spin',pinned(f),'pin','Pin to top')+ib('needs',!!f.needs,'circle','Needs doing')+
    (isTask(f)?'':ib('review',!!f.review_later,'flag','Review later'))+
    '<button class="ib" data-act="attach" aria-label="Add document">'+ico('plus')+'</button>';
}
function delHtml(){
  return sh.id?'<button class="ib del" data-act="delete" aria-label="Delete">'+ico('trash')+'</button>':'';
}
function addCat(name){
  name=name.trim();if(!name)return;
  var have=state.cats.filter(live).find(function(c){return c.name.toLowerCase()===name.toLowerCase()});
  if(!have){have={name:name,colour:'var(--cat-'+(state.cats.length%6+1)+')',deleted_at:''};state.cats.push(have);save()}
  sh.f.category=have.name;sh.newcat=false;setOpen(null);
}
function refreshDrawer(){refreshPills();var d=document.getElementById('drawer');if(d&&sh.open)d.innerHTML=drawerHtml()}
function setOpen(k){
  sh.open=k;sh.newcat=false;refreshPills();
  var b=document.getElementById('sbody'),d=document.getElementById('drawer');if(!b)return;
  if(k){d.innerHTML=drawerHtml();d.scrollTop=0}
  b.classList.toggle('open',!!k);
}
function refreshPills(){
  document.getElementById('pills').innerHTML=pillsHtml();
  document.getElementById('sh-label').textContent=headText();
  var sb=document.getElementById('sbar');if(sb){sb.querySelectorAll('.ib:not(.del)').forEach(function(b){b.remove()});sb.insertAdjacentHTML('afterbegin',sbarHtml())}
}
function saveSheet(){
  if(!sh)return;
  var f=sh.f,title=f.title.trim();
  if(!title)return;
  var q=parseQuick(title,state,today());
  if(q.title)title=q.title;
  if(q.category)f.category=q.category;
  if(q.due)f.due=q.due;
  if(q.mins)f.estimate_mins=q.mins;
  if(f.time&&!f.due)f.due=todayStr();
  var r=sh.id&&findItem(sh.id),keep={title:title,details:f.details.trim(),category:f.category,due:f.due,time:f.time,estimate_mins:Number(f.estimate_mins)||0,needs:!!f.needs,important:f.important,review_later:!!f.review_later,files:(f.files||[]).slice()};
  if(r){Object.keys(keep).forEach(function(k){r[k]=keep[k]});r.updated=nowIso();if(!isTask(r)){r.done=false;r.done_at=''}}
  else{r=newItem(keep);state.items.push(r)}
  if(screen==='day'&&r.due&&weekDays().some(function(d){return ymd(d)===r.due}))picked=r.due;
  save();closeSheet();render();
}
function openSettings(){
  sh=null;
  $sheet.setAttribute('aria-label','Settings');
  $sheet.innerHTML='<div class="sh-head"><span class="label">Settings</span><button class="x" data-act="close" aria-label="Close">'+ico('x')+'</button></div>'+
    '<div class="panel">'+
    '<button class="row" data-act="toggleupd" role="switch" aria-checked="'+upd+'" aria-label="Preview update banner" style="padding:0"><span class="open" style="pointer-events:none"><span class="main"><b>Preview update banner</b><span class="meta">Demo only</span></span></span><span class="sw'+(upd?' on':'')+'"><i></i></span></button>'+
    '<button class="row" data-act="reset" aria-label="Reset demo" style="padding:0"><span class="open" style="pointer-events:none"><span class="main"><b>Reset demo</b><span class="meta">Back to the sample data</span></span></span></button>'+
    '</div><p class="foot">Demo 2 · saved on this device</p>';
  $scrim.classList.add('show');$sheet.classList.add('show');
}
function refresh(btn){
  if(spinning)return;
  spinning=true;btn.classList.add('spin');
  setTimeout(function(){spinning=false;state=load();render();toast('Up to date')},800);
}
function deleteSheet(){
  var r=sh&&sh.id&&findItem(sh.id);if(!r)return;
  closeSheet();
  mutate(function(){r.deleted_at=nowIso();r.deleted_by='you'});
  toast('Deleted: '+r.title,function(){mutate(function(){r.deleted_at='';r.deleted_by=''})});
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var act=el.getAttribute('data-act'),id=el.getAttribute('data-id'),v=el.getAttribute('data-v');
  switch(act){
    case 'tab':goTab(v);break;
    case 'day':changeDay(v);break;
    case 'tick':tick(id);break;
    case 'later':later(id);break;
    case 'pin':togglePin(id);break;
    case 'open':openSheet(id);break;
    case 'down':$scroll.scrollBy({top:$scroll.clientHeight*.7,behavior:still()?'auto':'smooth'});break;
    case 'expand':flip(function(){openPick=id;render()});break;
    case 'fold':flip(function(){openPick=null;render()});break;
    case 'add':
      if(screen==='secrets'&&vf==='docs'){openDoc();break}
      if(screen==='secrets'){openSecret();break}
      openSheet(null);break;
    case 'attach':pickFile(function(l){sh.f.files=(sh.f.files||[]).concat(l);document.getElementById('files').innerHTML=filesHtml()});break;
    case 'unattach':sh.f.files.splice(+v,1);document.getElementById('files').innerHTML=filesHtml();break;
    case 'undo':var u=toastUndo;hideToast();if(u)u();break;
    case 'nfreview':nf.review=!nf.review;render();break;
    case 'vtab':vf=v;vaultOpen=null;vShow=false;render();break;
    case 'vexpand':flip(function(){vaultOpen=id;vShow=false;render()});break;
    case 'vfold':flip(function(){vaultOpen=null;render()});break;
    case 'vshow':vShow=!vShow;render();break;
    case 'vcopy':toast('Copied');break;
    case 'vdoc':toast('Opens the file in the live app');break;
    case 'vdots':toast('Edit comes in the live app');break;
    case 'nsopen':nsOpen=true;render();var q=document.getElementById('nq');if(q)q.focus();break;
    case 'nsclose':nsOpen=false;nq='';render();break;
    case 'nfall':nf={review:false,cat:''};render();break;
    case 'nexpand':flip(function(){noteOpen=id;render()});break;
    case 'nfold':flip(function(){noteOpen=null;render()});break;
    case 'rlater':(function(){var r=findItem(id);if(r)mutate(function(){r.review_later=!r.review_later;r.updated=nowIso()})})();break;
    case 'nfcat':nf.cat=nf.cat===v?'':v;render();break;
    case 'reset':closeSheet();state=seed();save();picked=todayStr();nf={review:false,cat:''};render();toast('Demo reset');break;
    case 'settings':openSettings();break;
    case 'toggleupd':upd=!upd;openSettings();render();break;
    case 'update':location.reload();break;
    case 'refresh':if(upd)location.reload();else refresh(el);break;
    case 'close':closeSheet();break;
    case 'save':saveSheet();break;
    case 'vtype':var vs=document.querySelectorAll('[data-act="vtype"]');vs.forEach(function(b){b.classList.toggle('on',b===el)});break;
    case 'dcat':newDoc.cat=newDoc.cat===v?'':v;document.querySelectorAll('[data-act="dcat"]').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-v')===newDoc.cat)});break;
    case 'dpick':pickFile(function(l){if(!l.length)return;newDoc.file=l[0];var n=document.getElementById('d-name');if(n&&!n.value.trim())n.value=l[0].name.replace(/\.[^.]+$/,'');document.getElementById('d-file').innerHTML=docFileHtml();docReady()});break;
    case 'dsave':var dn=document.getElementById('d-name').value.trim();if(!dn||!newDoc.file)break;
      VAULT.docs.unshift({id:'d'+Date.now(),title:dn,meta:(newDoc.file.name.split('.').pop()||'File').toUpperCase()+', '+fsize(newDoc.file.size),cat:newDoc.cat||'Home'});
      closeSheet();render();toast('Document saved');break;
    case 'vsave':var nm=document.getElementById('v-name').value.trim(),vv=document.getElementById('v-val').value;if(!nm||!vv)break;
      var ty=document.querySelector('[data-act="vtype"].on');VAULT.secrets.unshift({id:'s'+Date.now(),title:nm,meta:ty?ty.getAttribute('data-v'):'Password',val:vv,cat:'Home'});
      closeSheet();render();toast('Secret saved');break;
    case 'delete':deleteSheet();break;
    case 'pill':
      if(v==='pin'){sh.f.important=pinned(sh.f)?'':'yes';refreshPills()}
      else if(v==='review'){sh.f.review_later=!sh.f.review_later;refreshPills()}
      else{setOpen(sh.open===v?null:v)}
      break;
    case 'setcat':sh.f.category=v;sh.newcat=false;setOpen(null);break;
    case 'newcat':sh.newcat=true;refreshDrawer();var ni=document.getElementById('f-newcat');if(ni)ni.focus();break;
    case 'setdate':sh.f.due=v;setOpen(null);break;
    case 'settime':sh.f.time=v;refreshDrawer();break;
    case 'setmins':sh.f.estimate_mins=Number(v)||0;setOpen(null);break;
    case 'needs':sh.f.needs=!sh.f.needs;refreshPills();break;
    case 'spin':sh.f.important=pinned(sh.f)?'':'yes';refreshPills();break;
    case 'review':sh.f.review_later=!sh.f.review_later;refreshPills();break;
  }
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='d-name'){docReady();return}
  if(t.id==='nq'){nq=t.value;noteOpen=null;document.getElementById('nlist').innerHTML=notesList();return}
  if(t.id==='vq'){vq=t.value;vaultOpen=null;document.getElementById('vlist').innerHTML=vaultList();return}
  if(!sh)return;
  if(t.getAttribute&&t.getAttribute('data-f')){
    sh.f[t.getAttribute('data-f')]=t.value;
    if(t.id==='f-title'){var b=document.getElementById('save');if(b)b.disabled=!t.value.trim()}
  }else if(t.id==='f-date'){sh.f.due=t.value;refreshPills()}
  else if(t.id==='f-time'){sh.f.time=t.value;refreshPills()}
});
document.addEventListener('focusout',function(e){
  if(sh&&sh.newcat&&e.target.id==='f-newcat'&&e.target.value.trim())addCat(e.target.value);
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&sh&&sh.newcat){sh.newcat=false;refreshDrawer();return}
  if(e.key==='Enter'&&sh&&e.target.id==='f-newcat'){e.preventDefault();addCat(e.target.value);return}
  if(e.key==='Escape'&&$sheet.classList.contains('show'))closeSheet();
  if(e.key==='Enter'&&sh&&e.target.id==='f-title'){e.preventDefault();saveSheet()}
});

$scroll.addEventListener('scroll',checkDown,{passive:true});
document.addEventListener('scroll',function(e){var f=e.target;if(f.classList&&f.classList.contains('filters'))f.classList.toggle('scrolled',f.scrollLeft>2)},true);
/* filter row: mouse wheel + drag scroll sideways (touch already swipes) */
$scroll.addEventListener('wheel',function(e){
  var f=e.target.closest&&e.target.closest('.filters');if(!f||Math.abs(e.deltaX)>Math.abs(e.deltaY))return;
  if(f.scrollWidth<=f.clientWidth)return;e.preventDefault();f.scrollLeft+=e.deltaY;
},{passive:false});
(function(){var f=null,x0=0,s0=0,moved=false;
  $scroll.addEventListener('pointerdown',function(e){if(e.pointerType!=='mouse')return;f=e.target.closest&&e.target.closest('.filters');if(!f)return;x0=e.clientX;s0=f.scrollLeft;moved=false});
  window.addEventListener('pointermove',function(e){if(!f)return;var dx=e.clientX-x0;if(Math.abs(dx)>4)moved=true;f.scrollLeft=s0-dx});
  window.addEventListener('pointerup',function(){f=null});
  document.addEventListener('click',function(e){if(moved&&e.target.closest&&e.target.closest('.filters')){e.stopPropagation();e.preventDefault();moved=false}},true);
})();window.addEventListener('resize',function(){checkDown();placeHl()});
render();
})();
</script>
</body>
</html>
