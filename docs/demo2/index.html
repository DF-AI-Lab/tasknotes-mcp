<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TaskNotes demo 2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* ===== TOKENS (the style guide) ===== */
:root{
  --bg:#101114;
  --glow:#3a3b41;
  --surface:rgba(255,255,255,.06);
  --surface-2:rgba(255,255,255,.10);
  --hero:linear-gradient(160deg,rgba(255,255,255,.15),rgba(255,255,255,.05));
  --edge:rgba(255,255,255,.08);
  --line:rgba(255,255,255,.08);
  --text:#f2f3f7;
  --muted:#8b8d94;
  --accent:#f2f3f7;
  --on-accent:#0c0d12;
  --late:#ff8a80;
  --cat-1:#ffb072; --cat-2:#9db4ff; --cat-3:#c9a6ff; --cat-4:#6fe0b5; --cat-5:#ff9ec4; --cat-6:#f2d675;
  --display:"Bricolage Grotesque","Geist",system-ui,sans-serif;
  --font:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,Menlo,monospace;
  --gutter:20px; --gap:16px;
  --r-hero:26px; --r-panel:22px; --r-day:16px; --r-pill:99px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(130% 420px at 50% -120px,var(--glow) 0%,transparent 65%),var(--bg);background-attachment:fixed;
  color:var(--text);font:15px/1.35 var(--font);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ===== FRAME ===== */
.app{height:100%;max-width:430px;margin:0 auto;display:flex;flex-direction:column;position:relative}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:calc(20px + env(safe-area-inset-top)) var(--gutter) 24px;display:flex;flex-direction:column;gap:var(--gap)}
.scroll>*{flex:none}

/* ===== HEADER ===== */
.head{display:flex;justify-content:space-between;align-items:center}
.eyebrow{font-size:14px;color:var(--muted)}
.title{font:700 31px/1.05 var(--display);letter-spacing:-.02em;margin:0}
.ring{width:52px;height:52px;position:relative;display:grid;place-items:center;font:500 12.5px var(--mono)}
.ring svg{position:absolute;inset:0;width:100%;height:100%;stroke-width:3;transform:rotate(-90deg)}
.ring .track{stroke:rgba(255,255,255,.12)} .ring .fill{stroke:var(--accent)}

/* ===== WEEK STRIP ===== */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;padding:9px 0 8px;border-radius:var(--r-day);font-size:12px;color:var(--muted)}
.day b{font:600 16px var(--font);color:var(--text)}
.day .load{height:24px;display:flex;align-items:flex-end}
.day .load i{display:block;width:4px;border-radius:4px;background:var(--muted)}
.day.on{background:var(--accent);color:#55575e}
.day.on b{color:var(--on-accent)} .day.on .load i{background:var(--on-accent)}

/* ===== SHARED BITS ===== */
.label{font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px;margin-bottom:-6px}
.label svg{width:14px;height:14px}
.meta{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:6px}
.meta .late{color:var(--late)}
.meta .mono{font-family:var(--mono)}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.tick{width:24px;height:24px;border-radius:50%;border:1.6px solid var(--muted);flex:none;display:grid;place-items:center;position:relative}
.tick::after{content:"";position:absolute;inset:-10px}
.tick.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tick svg{width:13px;height:13px;stroke-width:2.6}

/* ===== NOW CARD (one per screen) ===== */
.now{border-radius:var(--r-hero);padding:20px 20px 18px;display:flex;flex-direction:column;gap:10px;background:var(--hero);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 18px 30px -18px rgba(0,0,0,.7)}
.now-top{display:flex;justify-content:space-between;align-items:center}
.now h2{font:700 31px/1.05 var(--display);letter-spacing:-.02em;margin:0;overflow-wrap:anywhere}
.now p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
.now .open{display:flex;flex-direction:column;gap:10px;text-align:left;width:100%}
.btns{display:flex;gap:8px;margin-top:4px}
.btn{flex:1;height:46px;border-radius:var(--r-pill);font-weight:600;font-size:15px;background:var(--surface-2)}
.btn.primary{flex:2;background:var(--accent);color:var(--on-accent)}
.btn:active{transform:scale(.97)}
.btn[aria-disabled=true]{opacity:.4}
.pin{color:var(--muted);width:32px;height:32px;display:grid;place-items:center;border-radius:50%;position:relative}
.pin::after{content:"";position:absolute;inset:-6px}
.pin.on{color:var(--text);background:var(--surface-2)}
.pin svg{width:17px;height:17px}

/* ===== PANEL + ROWS ===== */
.panel{border-radius:var(--r-panel);background:var(--surface);box-shadow:inset 0 1px 0 var(--edge);padding:2px 16px}
.row{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);min-height:56px;width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row .main{min-width:0;flex:1}
.row b{font-weight:600;font-size:15.5px;display:block;overflow-wrap:anywhere}
.row .end{font-size:13px;color:var(--muted);white-space:nowrap}
.row.note .glyph{width:24px;height:24px;display:grid;place-items:center;color:var(--muted);flex:none}
.row.note .meta{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.note .meta .dot{display:inline-block;margin-right:6px;vertical-align:1px}
.quiet{color:var(--muted);font-size:14px;text-align:center;padding:10px 0}
.empty{padding:22px 0}
.linkbtn{color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px;align-self:center;min-height:44px;padding:0 12px}

/* ===== CHIPS (filters, pickers) ===== */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:36px;padding:0 14px;border-radius:var(--r-pill);background:var(--surface);color:var(--muted);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:7px;position:relative;box-shadow:inset 0 1px 0 var(--edge)}
.chip::before{content:"";position:absolute;inset:-4px 0}
.chip.on{background:var(--surface-2);color:var(--text)}

/* ===== BOTTOM BAR ===== */
.bar{flex:none;display:grid;grid-template-columns:1fr 1fr 64px 1fr 1fr;align-items:center;padding:8px 10px calc(14px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);background:rgba(16,17,20,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tab{height:44px;font-size:14px;font-weight:500;color:var(--muted)}
.tab.on{color:var(--text);font-weight:700}
.add{width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;justify-self:center;margin-top:-22px;
  box-shadow:0 10px 24px rgba(0,0,0,.6),0 0 0 6px var(--bg)}
.add svg{width:22px;height:22px;stroke-width:2}

/* ===== TOAST ===== */
.toast{position:absolute;left:var(--gutter);right:var(--gutter);bottom:96px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:4px 6px 4px 18px;min-height:52px;border-radius:var(--r-pill);background:linear-gradient(var(--surface-2),var(--surface-2)),var(--bg);
  box-shadow:inset 0 1px 0 var(--edge),0 14px 28px -10px rgba(0,0,0,.8);font-size:14px;z-index:5;transition:opacity .2s,transform .2s}
.toast[hidden]{display:none}
.toast button[hidden]{display:none}
.toast button{height:44px;padding:0 16px;font-weight:600;border-radius:var(--r-pill)}

/* ===== SHEET ===== */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10;opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:430px;max-height:92%;z-index:11;display:flex;flex-direction:column;gap:var(--gap);
  padding:10px var(--gutter) calc(18px + env(safe-area-inset-bottom));overflow-y:auto;
  border-radius:var(--r-hero) var(--r-hero) 0 0;background:linear-gradient(var(--surface-2),var(--surface-2)),var(--bg);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18);transform:translateY(100%);transition:transform .25s ease}
.sheet.show{transform:none}
.sheet[hidden],.scrim[hidden]{display:none}
.grab{width:36px;height:4px;border-radius:4px;background:var(--muted);opacity:.5;align-self:center;flex:none}
.sheet-top{display:flex;align-items:center;justify-content:space-between}
.fields{border-radius:var(--r-panel);background:var(--surface);box-shadow:inset 0 1px 0 var(--edge);padding:2px 16px}
.fields input,.fields textarea{width:100%;background:none;border:0;color:var(--text);font:inherit;outline:0;padding:14px 0;resize:none;display:block}
.fields input{font-size:18px;font-weight:600;border-bottom:1px solid var(--line)}
.fields textarea{font-size:15px;min-height:96px;line-height:1.45}
.fields ::placeholder{color:var(--muted)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{height:44px;padding:0 16px;border-radius:var(--r-pill);background:var(--surface);color:var(--muted);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:8px;box-shadow:inset 0 1px 0 var(--edge)}
.pill.set{background:var(--surface-2);color:var(--text)}
.pill svg{width:16px;height:16px}
.switch{width:34px;height:20px;border-radius:var(--r-pill);background:rgba(255,255,255,.12);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(14px);background:var(--on-accent)}
.picker{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.picker[hidden]{display:none}
.picker input{height:44px;border-radius:var(--r-pill);background:var(--surface-2);border:0;color:var(--text);font:500 14px var(--font);padding:0 16px;color-scheme:dark;min-width:0}
.sheet .btns{margin-top:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-tick" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-note" viewBox="0 0 24 24"><path d="M6 4h9l4 4v12H6z"/><path d="M9 11h7M9 15h5"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M9 4h6l-1 5.5 3 3V14H7v-1.5l3-3z"/><path d="M12 14v6"/></symbol>
</svg>

<main class="app">
  <div class="scroll" id="scroll"></div>
  <div class="toast" id="toast" hidden role="status"><span id="toastMsg"></span><button id="toastUndo">Undo</button></div>
  <nav class="bar">
    <button class="tab" data-tab="day">Day</button>
    <button class="tab" data-tab="notes">Notes</button>
    <button class="add" id="addBtn" aria-label="Add"><svg><use href="#i-plus"/></svg></button>
    <button class="tab" data-tab="done">Done</button>
    <button class="tab" data-tab="secrets">Secrets</button>
  </nav>
</main>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" hidden aria-label="Item"></section>

<script>
(function () {
'use strict';
/* ===== Copied from docs/store.js (field names kept so going live is easy) ===== */
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const fromYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const nowIso = () => new Date().toISOString();
const rid = p => p + '_' + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const fmtMins = m => { m = Number(m) || 0; if (!m) return ''; return m >= 60 ? Math.floor(m / 60) + 'h' + (m % 60 ? ' ' + (m % 60) + 'm' : '') : m + 'm'; };
const DAYS = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
function parseQuick(text, s, today) {
  let t = ' ' + String(text || '') + ' ', category = '', due = '', mins = 0;
  t = t.replace(/\s#([\w-]+)/g, (m, c) => {
    const hit = s.cats.find(x => x.name.toLowerCase().replace(/\s+/g, '').startsWith(c.toLowerCase()));
    if (hit) { category = hit.name; return ' '; }
    return m;
  });
  t = t.replace(/\s(\d+(?:\.\d+)?)\s?(h|hr|hrs|hours?|m|min|mins|minutes?)(?=\s)/i, (m, n, u) => {
    mins = Math.round(Number(n) * (/^h/i.test(u) ? 60 : 1)); return ' ';
  });
  t = t.replace(/\s(today|tonight|tomorrow|tmrw|mon|tue|wed|thu|fri|sat|sun)[a-z]*(?=\s)/i, (m, w) => {
    w = w.toLowerCase();
    if (w === 'today' || w === 'tonight') due = ymd(today);
    else if (w === 'tomorrow' || w === 'tmrw') due = ymd(addDays(today, 1));
    else { let n = (DAYS.indexOf(w) - today.getDay() + 7) % 7; if (n === 0) n = 7; due = ymd(addDays(today, n)); }
    return ' ';
  });
  return {title: t.replace(/\s+/g, ' ').trim(), category, due, mins};
}

/* ===== Data: one list of items. A note has no date/time/needs_doing; a task has at least one. ===== */
const KEY = 'tasknotes-demo2';
const CATS = [{name: 'Home', n: 1}, {name: 'Work', n: 3}, {name: 'AI Lab', n: 2}, {name: 'Health', n: 4}];
const catVar = name => { const c = CATS.find(x => x.name === name); return 'var(--cat-' + (c ? c.n : 1) + ')'; };
const isTask = r => !!(r.due || r.time || r.needs_doing);
const pinned = r => r.important === 'yes';
const live = r => !r.deleted_at;

function seed(today) {
  const d = n => ymd(addDays(today, n));
  const items = [];
  const add = f => { items.push(Object.assign({id: rid('i'), title: '', details: '', category: 'Home', due: '', time: '', estimate_mins: 0,
    needs_doing: false, important: '', done: false, done_at: '', review_later: false, created: nowIso(), updated: nowIso(), deleted_at: ''}, f)); return items[items.length - 1]; };
  [['Book MOT', 'Home', d(0), 15, "Garage on Main St. Ring before 10am, ask for the Saturday slot."],
   ['Set up Cloudflare Worker', 'AI Lab', d(0), 60, ''], ["Reply to Sam's email", 'Work', d(0), 10, 'Say yes to Thursday'],
   ['Gym: legs', 'Health', d(0), 50, ''], ['Pay window cleaner', 'Home', d(-1), 5, ''], ['Clean out the shed', 'Home', d(1), 90, ''],
   ['Write MCP tool list', 'AI Lab', d(1), 30, ''], ['Send invoice', 'Work', d(3), 20, ''], ['Plan next sprint', 'Work', d(12), 45, '']]
    .forEach(([title, category, due, estimate_mins, details]) => add({title, category, due, estimate_mins, details}));
  items.find(x => x.title === 'Send invoice').important = 'yes';
  add({title: 'Order bin bags', category: 'Home', due: d(0), estimate_mins: 5, done: true, done_at: nowIso()});
  add({title: 'Read about passkeys', category: 'AI Lab', estimate_mins: 25, details: 'Start with the WebAuthn basics.'});
  [['Shared login for all DF apps', 'AI Lab', true, 'One sign-in that works across every app.'], ['Try reminders v2', 'AI Lab', false, ''],
   ['Fence panel is loose', 'Home', true, 'Back left corner. Needs two brackets and a post cap.'], ['Ask about Friday rota', 'Work', true, ''],
   ['Stretch after runs', 'Health', false, '']]
    .forEach(([title, category, review_later, details]) => add({title, category, review_later, details}));
  items.find(x => x.title === 'Fence panel is loose').important = 'yes';
  return items;
}

let items = [], tab = 'day', today = new Date(), picked = ymd(today), filterCat = '', filterReview = false;
let toastTimer = 0, memory = null;

function load() {
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) { raw = memory; }
  try { const v = raw && JSON.parse(raw); if (v && Array.isArray(v.items)) { items = v.items; return; } } catch (e) {}
  items = seed(today);
  save();
}
function save() {
  const raw = JSON.stringify({v: 1, items});
  try { localStorage.setItem(KEY, raw); } catch (e) { memory = raw; }
}
const find = id => items.find(r => r.id === id);
function touch(r) { r.updated = nowIso(); save(); }

/* ===== Helpers ===== */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const tstr = () => ymd(today);
const short = s => { const d = fromYmd(s); return d.getDate() + ' ' + MONTHS[d.getMonth()].slice(0, 3); };
function dayWord(s) {
  const diff = Math.round((fromYmd(s) - fromYmd(tstr())) / 86400000);
  if (diff === 0) return 'Today'; if (diff === 1) return 'Tomorrow'; if (diff === -1) return 'Yesterday';
  if (diff > 1 && diff < 7) return WD[fromYmd(s).getDay()];
  return short(s);
}
const dueOf = r => r.due || tstr();                       // a task with no date belongs to today
const tasksOn = day => items.filter(r => live(r) && isTask(r) && dueOf(r) === day);
function order(a, b) {
  if (pinned(a) !== pinned(b)) return pinned(a) ? -1 : 1;
  if (!!a.time !== !!b.time) return a.time ? -1 : 1;
  return a.time < b.time ? -1 : a.time > b.time ? 1 : 0;
}
const preview = r => (r.details || '').replace(/\s+/g, ' ').trim();
const dotEl = c => '<i class="dot" style="background:' + catVar(c) + '"></i>';
const timeEl = r => r.time ? '<span class="mono">' + esc(r.time) + '</span>' : '';

function taskRow(r, opts) {
  opts = opts || {};
  const bits = [dotEl(r.category) + esc(r.category)];
  if (opts.late) bits.push('<span class="late">' + esc(short(r.due)) + '</span>');
  else if (opts.day) bits.push(esc(dayWord(dueOf(r))));
  if (r.time) bits.push(timeEl(r));
  return '<button class="row" data-open="' + r.id + '"><span class="tick" data-tick="' + r.id + '" role="checkbox" aria-checked="false" aria-label="Done"></span>' +
    '<span class="main"><b>' + esc(r.title) + '</b><span class="meta">' + bits.join(' · ').replace(/<\/i>/g, '</i>') + '</span></span>' +
    (r.estimate_mins ? '<span class="end">' + fmtMins(r.estimate_mins) + '</span>' : '') + '</button>';
}
function noteRow(r) {
  const p = preview(r);
  return '<button class="row note" data-open="' + r.id + '"><span class="glyph"><svg><use href="#i-note"/></svg></span><span class="main"><b>' + esc(r.title) +
    '</b><span class="meta">' + (p ? esc(p) : dotEl(r.category) + esc(r.category)) + '</span></span></button>';
}

/* ===== Screens ===== */
const scroll = document.getElementById('scroll');

function renderDay() {
  const pd = fromYmd(picked), isToday = picked === tstr();
  const mon = addDays(fromYmd(tstr()), -((today.getDay() + 6) % 7));
  const dayTasks = tasksOn(picked);
  const doneN = dayTasks.filter(r => r.done).length, total = dayTasks.length;
  const circ = 144.5, fill = total ? (circ * doneN / total).toFixed(1) : 0;
  let h = '<header class="head"><div><div class="eyebrow">' + MONTHS[pd.getMonth()] + '</div><h1 class="title">' + WD[pd.getDay()] + ' ' + pd.getDate() + '</h1></div>' +
    '<div class="ring" aria-label="' + doneN + ' of ' + total + ' done"><svg viewBox="0 0 52 52"><circle class="track" cx="26" cy="26" r="23"/><circle class="fill" cx="26" cy="26" r="23" stroke-dasharray="' + fill + ' ' + circ + '"/></svg>' + doneN + '/' + total + '</div></header>';
  h += '<nav class="week" aria-label="This week">';
  for (let i = 0; i < 7; i++) {
    const d = addDays(mon, i), k = ymd(d), ts = tasksOn(k), mins = ts.reduce((a, r) => a + (Number(r.estimate_mins) || 0), 0);
    const bar = ts.length ? '<i style="height:' + Math.round(3 + 21 * Math.min(1, mins / 120)) + 'px"></i>' : '';
    h += '<button class="day' + (k === picked ? ' on' : '') + '"' + (k === tstr() ? ' aria-current="date"' : '') + ' data-day="' + k + '">' + 'MTWTFSS'[i] + '<b>' + d.getDate() + '</b><span class="load">' + bar + '</span></button>';
  }
  h += '</nav>';

  const left = dayTasks.filter(r => !r.done).sort(order);
  const pinnedOther = items.filter(r => live(r) && !r.done && pinned(r) && (!isTask(r) || dueOf(r) !== picked));
  const pinnedIds = new Set(pinnedOther.map(r => r.id));
  const now = isToday ? left[0] : null;
  if (isToday) {
    if (now) {
      h += '<section class="now" aria-label="Now"><div class="now-top"><span class="meta">' + dotEl(now.category) + esc(now.category) + (now.estimate_mins ? ' · ' + (now.estimate_mins >= 60 ? fmtMins(now.estimate_mins) : now.estimate_mins + ' min') : '') + (now.time ? ' · ' + timeEl(now) : '') + '</span>' +
        '<button class="pin' + (pinned(now) ? ' on' : '') + '" data-pin="' + now.id + '" aria-label="Pin" aria-pressed="' + pinned(now) + '"><svg><use href="#i-pin"/></svg></button></div>' +
        '<button class="open" data-open="' + now.id + '"><h2>' + esc(now.title) + '</h2>' + (now.details ? '<p>' + esc(now.details) + '</p>' : '') + '</button>' +
        '<div class="btns"><button class="btn" data-later="' + now.id + '">Later</button><button class="btn primary" data-done="' + now.id + '">Done</button></div></section>';
    } else {
      h += '<p class="quiet">All done for today</p>';
    }
  }
  if (pinnedOther.length) {
    h += '<div class="label"><svg><use href="#i-pin"/></svg>Pinned</div><div class="panel">' +
      pinnedOther.sort((a, b) => (isTask(a) ? 1 : 0) - (isTask(b) ? 1 : 0)).map(r => isTask(r) ? taskRow(r, {day: true}) : noteRow(r)).join('') + '</div>';
  }
  if (isToday) {
    const late = items.filter(r => live(r) && isTask(r) && !r.done && r.due && r.due < tstr() && !pinnedIds.has(r.id)).sort((a, b) => a.due < b.due ? -1 : 1);
    if (late.length) h += '<div class="label">Late</div><div class="panel">' + late.map(r => taskRow(r, {late: true})).join('') + '</div>';
  }
  const then = left.filter(r => r !== now);
  if (then.length) h += '<div class="label">' + (isToday ? 'Then' : 'Tasks') + '</div><div class="panel">' + then.map(r => taskRow(r)).join('') + '</div>';
  else if (!isToday && !left.length) h += '<p class="quiet">' + (total ? 'All done' : 'Nothing planned') + '</p>';
  scroll.innerHTML = h;
}

function renderNotes() {
  const notes = items.filter(r => live(r) && !isTask(r));
  let h = '<header class="head"><div><div class="eyebrow">' + notes.length + (notes.length === 1 ? ' note' : ' notes') + '</div><h1 class="title">Notes</h1></div></header>';
  h += '<div class="chips"><button class="chip' + (filterReview ? ' on' : '') + '" data-review aria-pressed="' + filterReview + '">Review later</button>' +
    CATS.map(c => '<button class="chip' + (filterCat === c.name ? ' on' : '') + '" data-cat="' + esc(c.name) + '">' + dotEl(c.name) + esc(c.name) + '</button>').join('') + '</div>';
  const shown = notes.filter(r => (!filterReview || r.review_later) && (!filterCat || r.category === filterCat));
  const pin = shown.filter(pinned), rest = shown.filter(r => !pinned(r));
  if (pin.length) h += '<div class="label"><svg><use href="#i-pin"/></svg>Pinned</div><div class="panel">' + pin.map(noteRow).join('') + '</div>';
  if (rest.length) h += (pin.length ? '<div class="label">All notes</div>' : '') + '<div class="panel">' + rest.map(noteRow).join('') + '</div>';
  if (!shown.length) h += '<p class="quiet empty">No notes here yet</p>';
  scroll.innerHTML = h;
}

function renderDone() {
  const done = items.filter(r => live(r) && isTask(r) && r.done).sort((a, b) => a.done_at < b.done_at ? 1 : -1);
  let h = '<header class="head"><div><div class="eyebrow">' + done.length + ' ticked off</div><h1 class="title">Done</h1></div></header>';
  const groups = [];
  done.forEach(r => {
    const k = ymd(new Date(r.done_at)); let g = groups.find(x => x.k === k);
    if (!g) groups.push(g = {k, list: []}); g.list.push(r);
  });
  groups.forEach(g => {
    h += '<div class="label">' + esc(dayWord(g.k)) + '</div><div class="panel">' + g.list.map(r =>
      '<button class="row" data-open="' + r.id + '"><span class="tick on" data-tick="' + r.id + '" role="checkbox" aria-checked="true" aria-label="Undo done"><svg><use href="#i-tick"/></svg></span>' +
      '<span class="main"><b>' + esc(r.title) + '</b><span class="meta">' + dotEl(r.category) + esc(r.category) + '</span></span>' +
      (r.estimate_mins ? '<span class="end">' + fmtMins(r.estimate_mins) + '</span>' : '') + '</button>').join('') + '</div>';
  });
  if (!done.length) h += '<p class="quiet empty">Nothing ticked off yet</p>';
  h += '<button class="linkbtn" id="reset">Reset demo</button>';
  scroll.innerHTML = h;
}

function renderSecrets() {
  scroll.innerHTML = '<header class="head"><div><div class="eyebrow">Private</div><h1 class="title">Secrets</h1></div></header>' +
    '<div class="panel"><p class="quiet empty">Secrets come back in the live version.</p></div>';
}

function render() {
  document.querySelectorAll('.tab').forEach(t => { const on = t.dataset.tab === tab; t.classList.toggle('on', on); if (on) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current'); });
  ({day: renderDay, notes: renderNotes, done: renderDone, secrets: renderSecrets})[tab]();
}

/* ===== Actions ===== */
const toastEl = document.getElementById('toast'), toastMsg = document.getElementById('toastMsg');
let undoFn = null;
function toast(msg, undo) {
  clearTimeout(toastTimer); undoFn = undo; toastMsg.textContent = msg; document.getElementById('toastUndo').hidden = !undo; toastEl.hidden = false;
  toastTimer = setTimeout(() => { toastEl.hidden = true; undoFn = null; }, 4000);
}
document.getElementById('toastUndo').onclick = () => { const f = undoFn; clearTimeout(toastTimer); toastEl.hidden = true; undoFn = null; if (f) f(); };

function setDone(id, on, withToast) {
  const r = find(id); if (!r) return;
  r.done = on; r.done_at = on ? nowIso() : ''; touch(r); render();
  if (on && withToast) toast('Ticked off', () => setDone(id, false));
}
function later(id) {
  const r = find(id); if (!r) return;
  const prev = r.due; r.due = ymd(addDays(fromYmd(tstr()), 1)); touch(r); render();
  toast('Moved to tomorrow', () => { r.due = prev; touch(r); render(); });
}
function togglePin(id) { const r = find(id); if (!r) return; r.important = pinned(r) ? '' : 'yes'; touch(r); render(); }

scroll.addEventListener('click', e => {
  const t = e.target;
  let el;
  if ((el = t.closest('[data-tick]'))) { const r = find(el.dataset.tick); setDone(r.id, !r.done, true); return; }
  if ((el = t.closest('[data-done]'))) { setDone(el.dataset.done, true, true); return; }
  if ((el = t.closest('[data-later]'))) { later(el.dataset.later); return; }
  if ((el = t.closest('[data-pin]'))) { togglePin(el.dataset.pin); return; }
  if ((el = t.closest('[data-open]'))) { openSheet(el.dataset.open); return; }
  if ((el = t.closest('[data-day]'))) { picked = el.dataset.day; render(); return; }
  if (t.closest('[data-review]')) { filterReview = !filterReview; render(); return; }
  if ((el = t.closest('[data-cat]'))) { filterCat = filterCat === el.dataset.cat ? '' : el.dataset.cat; render(); return; }
  if (t.closest('#reset')) { items = seed(today); save(); picked = tstr(); toast('Demo reset'); render(); return; }
});
document.querySelectorAll('.tab').forEach(b => b.onclick = () => { tab = b.dataset.tab; scroll.scrollTop = 0; render(); });
document.getElementById('addBtn').onclick = () => openSheet(null);

/* ===== Add / edit sheet ===== */
const sheet = document.getElementById('sheet'), scrim = document.getElementById('scrim');
let draft = null, openPick = '';

function openSheet(id) {
  const r = id && find(id);
  draft = r ? Object.assign({}, r) : {id: null, title: '', details: '', category: 'Home', due: '', time: '', estimate_mins: 0, needs_doing: false, important: '', review_later: false};
  if (!r && tab === 'day' && picked !== tstr()) draft.due = picked;
  openPick = '';
  sheet.innerHTML = '<div class="grab"></div><div class="sheet-top"><span class="eyebrow" id="kind"></span></div>' +
    '<div class="fields"><input id="fTitle" type="text" placeholder="Title" autocomplete="off" aria-label="Title"><textarea id="fDetails" placeholder="Notes" aria-label="Notes"></textarea></div>' +
    '<div class="pills" id="pills"></div><div class="picker" id="picker" hidden></div>' +
    '<div class="btns">' + (r ? '<button class="btn" id="fDelete">Delete</button>' : '<button class="btn" id="fCancel">Cancel</button>') + '<button class="btn primary" id="fSave">Save</button></div>';
  sheet.querySelector('#fTitle').value = draft.title;
  sheet.querySelector('#fDetails').value = draft.details || '';
  scrim.hidden = false; sheet.hidden = false;
  renderPills(); syncSave();
  requestAnimationFrame(() => { scrim.classList.add('show'); sheet.classList.add('show'); });
  if (!r) setTimeout(() => { const f = sheet.querySelector('#fTitle'); if (f) f.focus(); }, 260);
}
function closeSheet() {
  scrim.classList.remove('show'); sheet.classList.remove('show'); draft = null;
  setTimeout(() => { if (!draft) { sheet.hidden = true; scrim.hidden = true; sheet.innerHTML = ''; } }, 250);
}
function syncSave() {
  const ok = !!sheet.querySelector('#fTitle').value.trim();
  const b = sheet.querySelector('#fSave'); b.setAttribute('aria-disabled', !ok);
  sheet.querySelector('#kind').textContent = (draft.id ? 'Edit ' : 'New ') + (isTask(draft) ? 'task' : 'note');
}
function applyQuick() {
  const f = sheet.querySelector('#fTitle');
  const q = parseQuick(f.value, {cats: CATS}, today);
  if (q.title !== f.value.trim() || q.category || q.due || q.mins) {
    if (q.title) f.value = q.title;
    if (q.category) draft.category = q.category;
    if (q.due) draft.due = q.due;
    if (q.mins) draft.estimate_mins = q.mins;
    renderPills(); syncSave();
  }
}
function pill(key, label, set, extra) {
  return '<button class="pill' + (set ? ' set' : '') + '" data-pill="' + key + '"' + (extra || '') + '>' + label + '</button>';
}
function renderPills() {
  const d = draft;
  let h = pill('cat', dotEl(d.category) + esc(d.category), true);
  h += pill('due', d.due ? esc(dayWord(d.due)) : 'Date', !!d.due);
  h += pill('time', d.time ? '<span class="mono">' + esc(d.time) + '</span>' : 'Time', !!d.time);
  h += pill('mins', d.estimate_mins ? fmtMins(d.estimate_mins) : 'Minutes', !!d.estimate_mins);
  h += pill('needs', 'Needs doing<span class="switch' + (d.needs_doing ? ' on' : '') + '"></span>', d.needs_doing, ' role="switch" aria-checked="' + !!d.needs_doing + '"');
  h += pill('pin', '<svg><use href="#i-pin"/></svg>Pin', pinned(d), ' aria-pressed="' + pinned(d) + '"');
  if (!isTask(d)) h += pill('review', 'Review later', d.review_later, ' aria-pressed="' + !!d.review_later + '"');
  const box = sheet.querySelector('#pills');
  const tpl = document.createElement('div'); tpl.innerHTML = h;
  const nu = Array.from(tpl.children), old = Array.from(box.children);
  if (nu.length !== old.length) box.innerHTML = h;
  else nu.forEach((n, i) => { if (n.outerHTML !== old[i].outerHTML) old[i].replaceWith(n); });
  const p = sheet.querySelector('#picker'); let ph = '';
  if (openPick === 'cat') ph = CATS.map(c => '<button class="chip' + (d.category === c.name ? ' on' : '') + '" data-set-cat="' + esc(c.name) + '">' + dotEl(c.name) + esc(c.name) + '</button>').join('');
  if (openPick === 'due') ph = '<button class="chip" data-set-due="' + tstr() + '">Today</button><button class="chip" data-set-due="' + ymd(addDays(fromYmd(tstr()), 1)) + '">Tomorrow</button>' +
    '<input type="date" id="fDue" aria-label="Pick a date" value="' + esc(d.due) + '"><button class="chip" data-set-due="">No date</button>';
  if (openPick === 'time') ph = '<input type="time" id="fTime" aria-label="Pick a time" value="' + esc(d.time) + '"><button class="chip" data-set-time="">No time</button>';
  if (openPick === 'mins') ph = [5, 10, 15, 30, 45, 60, 90].map(m => '<button class="chip' + (d.estimate_mins === m ? ' on' : '') + '" data-set-mins="' + m + '">' + fmtMins(m) + '</button>').join('') + '<button class="chip" data-set-mins="0">None</button>';
  p.hidden = !ph; p.innerHTML = ph;
}
sheet.addEventListener('input', e => { if (e.target.id === 'fTitle') syncSave(); });
sheet.addEventListener('change', e => {
  if (e.target.id === 'fDue') { draft.due = e.target.value; renderPills(); syncSave(); }
  if (e.target.id === 'fTime') { draft.time = e.target.value; renderPills(); syncSave(); }
});
sheet.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'fTitle') { e.preventDefault(); applyQuick(); sheet.querySelector('#fDetails').focus(); } });
sheet.addEventListener('click', e => {
  if (!draft) return;
  const t = e.target; let el;
  if (t.closest('button') && !t.closest('#fSave')) applyQuick();
  if ((el = t.closest('[data-pill]'))) {
    const k = el.dataset.pill;
    if (k === 'needs') draft.needs_doing = !draft.needs_doing;
    else if (k === 'pin') draft.important = pinned(draft) ? '' : 'yes';
    else if (k === 'review') draft.review_later = !draft.review_later;
    else openPick = openPick === k ? '' : k;
    renderPills(); syncSave(); return;
  }
  if ((el = t.closest('[data-set-cat]'))) { draft.category = el.dataset.setCat; openPick = ''; renderPills(); return; }
  if ((el = t.closest('[data-set-due]'))) { draft.due = el.dataset.setDue; openPick = ''; renderPills(); syncSave(); return; }
  if ((el = t.closest('[data-set-time]'))) { draft.time = el.dataset.setTime; openPick = ''; renderPills(); syncSave(); return; }
  if ((el = t.closest('[data-set-mins]'))) { draft.estimate_mins = Number(el.dataset.setMins); openPick = ''; renderPills(); return; }
  if (t.closest('#fCancel')) { closeSheet(); return; }
  if (t.closest('#fDelete')) {
    const r = find(draft.id); if (r) { r.deleted_at = nowIso(); touch(r); }
    closeSheet(); render(); return;
  }
  if (t.closest('#fSave')) {
    applyQuick();
    const title = sheet.querySelector('#fTitle').value.trim();
    if (!title) { sheet.querySelector('#fTitle').focus(); return; }
    const f = {title, details: sheet.querySelector('#fDetails').value.trim(), category: draft.category, due: draft.due, time: draft.time,
      estimate_mins: Number(draft.estimate_mins) || 0, needs_doing: !!draft.needs_doing, important: draft.important, review_later: isTask(draft) ? false : !!draft.review_later};
    if (draft.id) { const r = find(draft.id); Object.assign(r, f); touch(r); }
    else { items.unshift(Object.assign({id: rid('i'), done: false, done_at: '', created: nowIso(), updated: nowIso(), deleted_at: ''}, f)); save(); }
    closeSheet(); render(); return;
  }
});
scrim.onclick = closeSheet;
document.addEventListener('keydown', e => { if (e.key === 'Escape' && draft) closeSheet(); });

load(); render();
})();
</script>
</body>
</html>
