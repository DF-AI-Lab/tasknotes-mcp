<!doctype html>
<html lang="en-GB" class="lockon">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101114">
<title>TaskNotes</title>
<meta name="description" content="Tasks and notes with categories. Works offline. Claude can help through MCP.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../passport/passport.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="tn-w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#d9dbe3"/></linearGradient>
<symbol id="tn" viewBox="0 0 120 120" stroke="none"><rect width="120" height="120" fill="url(#tn-w)"/><text x="56" y="82" text-anchor="middle" font-family="Bricolage Grotesque,Helvetica,Arial,sans-serif" font-weight="800" font-size="62" stroke="none" letter-spacing="-3" fill="#ff3b5c">TN</text><text x="60" y="82" text-anchor="middle" font-family="Bricolage Grotesque,Helvetica,Arial,sans-serif" font-weight="800" font-size="62" stroke="none" letter-spacing="-3" fill="#18c8e8">TN</text><text x="58" y="82" text-anchor="middle" font-family="Bricolage Grotesque,Helvetica,Arial,sans-serif" font-weight="800" font-size="62" stroke="none" letter-spacing="-3" fill="#0c0d12">TN</text><circle cx="99" cy="21" r="9" fill="#0c0d12"/><circle cx="99" cy="21" r="6.5" fill="#3fd6b0"/></symbol>
<symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.5-4.5L4 8M4 4v4h4M4 13a8 8 0 0 0 14.5 4.5L20 16M20 20v-4h-4"/></symbol>
<symbol id="i-dots" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="19" r="1.2"/></symbol>
</defs>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-tick" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-note" viewBox="0 0 24 24"><path d="M6 4h9l4 4v12H6z"/><path d="M9 11h7M9 15h5"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M9 4h6l-1 5.5 3 3V14H7v-1.5l3-3z"/><path d="M12 14v6"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 7V4h4v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></symbol>
  <symbol id="i-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m8.5 12.3 2.4 2.4 4.6-5"/></symbol>
  <symbol id="i-flag" viewBox="0 0 24 24"><path d="M7 3.5h10v17l-5-3.8-5 3.8z"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5M12 14.5v2.5"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M7 3.5h7l4 4V20.5H7z"/><path d="M14 3.5v4h4"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M15.5 8.5V5.5a1 1 0 0 0-1-1h-9a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h3"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="m14.5 6-6 6 6 6"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9.5 6 6 6-6 6"/></symbol>
  <symbol id="i-del" viewBox="0 0 24 24"><path d="M9 6h11v12H9l-6-6z"/><path d="m12.5 9.5 5 5M17.5 9.5l-5 5"/></symbol>
</svg>

<!-- the lock = Passport (../passport-lock.js draws it in here) -->
<section id="lock" class="lock" aria-live="polite"><div id="passport" class="passport"></div></section>

<main class="app" id="app" hidden>
  <div class="demobar" id="demobar" hidden>Demo mode: fake data, nothing is saved. <a href="./">Leave demo</a></div>
  <div class="top" id="top"></div>
  <div class="scroll" id="scroll"></div>
  <nav class="bar" aria-label="Screens">
    <button class="down" id="down" data-act="down" aria-label="Scroll down" tabindex="-1"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button>
    <button class="tab" data-act="tab" data-v="day">Day</button>
    <button class="tab" data-act="tab" data-v="notes">Notes</button>
    <button class="add" data-act="add" aria-label="Add"><svg><use href="#i-plus"/></svg></button>
    <button class="tab" data-act="tab" data-v="done">Done</button>
    <button class="tab" data-act="tab" data-v="secrets">Vault</button>
  </nav>
</main>

<div class="scrim" id="scrim" data-act="close"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Item"></section>
<div class="toast" id="toast" role="status"><span id="toast-msg"></span><button id="toast-undo" data-act="undo">Undo</button></div>

<script src="../store.js"></script>
<script src="../vault.js"></script>
<script src="../config.js"></script>
<script src="../passport/config.js"></script>
<script src="../passport/google.js"></script>
<script src="../passport/passport.js"></script>
<script src="../passport/ui.js"></script>
<script src="../sync.js"></script>
<script src="../gsheet.js"></script>
<script src="../passport-lock.js"></script>
<script src="app.js"></script>
</body>
</html>
